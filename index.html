<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅游记账本 · 多人AA算账</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%233182ce'/%3E%3Ctext%20x='32'%20y='46'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="旅游记账本 · 多人AA算账">
<meta property="og:description" content="多人出游记账，自动算清谁该转谁多少钱。">
<meta property="og:image" content="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%233182ce'/%3E%3Ctext%20x='32'%20y='46'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅游记账本">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f4f8; min-height: 100vh; padding: 16px; color: #2d3748;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; margin-bottom: 16px; color: #1a365d; }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #2b6cb0; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: bold;
  }
  .avatar.lg { width: 38px; height: 38px; font-size: 16px; }
  input, select {
    padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px;
    font-size: 15px; min-width: 0;
  }
  input:focus, select:focus { outline: none; border-color: #3182ce; }
  input[type=text] { width: 100%; }
  button {
    padding: 12px; border: none; border-radius: 8px;
    background: #3182ce; color: #fff; font-size: 16px; cursor: pointer;
  }
  button:active { background: #2b6cb0; }
  .btn-add { width: 100%; }
  .btn-small {
    padding: 5px 12px; font-size: 13px; background: #e53e3e;
    border-radius: 6px; width: auto;
  }
  .btn-ghost {
    background: none; color: #a0aec0; font-size: 13px; text-decoration: underline;
    padding: 6px; margin: 0 auto; display: block; width: auto;
  }
  .form-row { display: flex; gap: 8px; margin-bottom: 12px; }

  /* 成员 */
  .member { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .member input { flex: 1; }
  .member .x {
    background: #feb2b2; color: #9b2c2c; border-radius: 50%;
    width: 26px; height: 26px; padding: 0; font-size: 16px; flex: none;
    line-height: 26px;
  }
  .btn-member {
    background: #e2e8f0; color: #2d3748; width: 100%; font-size: 14px; padding: 10px;
  }

  /* 参与者 chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    border: 2px solid #cbd5e0; border-radius: 20px; cursor: pointer;
    font-size: 14px; background: #fff;
  }
  .chip.on { border-color: #3182ce; background: #ebf8ff; }
  .chip .avatar { width: 22px; height: 22px; font-size: 11px; }
  .hint { font-size: 12px; color: #718096; margin-bottom: 8px; }

  /* 支付人 */
  .payer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .payer-row .avatar { width: 26px; height: 26px; font-size: 12px; }
  .payer-row .nm { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .payer-row input { width: 90px; text-align: right; }

  /* 结算 */
  .summary { display: flex; justify-content: space-between; text-align: center; }
  .summary .num { font-size: 20px; font-weight: bold; color: #3182ce; }
  .summary .label { font-size: 12px; color: #718096; margin-top: 4px; }
  .pbook { margin-top: 12px; }
  .pbook .pr {
    display: flex; align-items: center; gap: 8px; font-size: 14px;
    padding: 6px 0; border-top: 1px solid #edf2f7;
  }
  .pbook .pr .nm { flex: 1; }
  .pbook .pr .val { font-weight: bold; }
  .settle-box {
    background: #fffaf0; border: 1px solid #f6e05e; border-radius: 8px;
    padding: 12px; margin-top: 12px; font-size: 15px; line-height: 1.8;
  }
  .settle-box .line { text-align: center; }
  .settle-box .amt { color: #d69e2e; font-weight: bold; font-size: 18px; }
  .even { color: #38a169; font-weight: bold; }

  /* 明细 */
  .record { padding: 12px 0; border-bottom: 1px solid #edf2f7; }
  .record:last-child { border-bottom: none; }
  .record .top { display: flex; justify-content: space-between; align-items: center; }
  .record .desc { font-size: 15px; font-weight: bold; }
  .record .del { margin-left: 8px; }
  .record .meta { font-size: 12px; color: #718096; margin-top: 6px; }
  .record .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .record .tag {
    display: flex; align-items: center; gap: 4px; font-size: 12px;
    background: #edf2f7; border-radius: 12px; padding: 2px 8px;
  }
  .record .tag .avatar { width: 18px; height: 18px; font-size: 10px; }
  .record .total { font-size: 14px; font-weight: bold; color: #2d3748; }
  .empty { text-align: center; color: #a0aec0; padding: 20px 0; font-size: 14px; }
  textarea { width:100%; padding:10px; border:1px solid #cbd5e0; border-radius:8px; font-size:13px; min-height:70px; }
  .share-out { margin-top:10px; }
  .share-out input { width:100%; font-size:12px; margin-bottom:8px; background:#f7fafc; }
  .btn-copy { width:100%; padding:10px; font-size:15px; background:#38a169; margin-bottom:8px; }
</style>
</head>
<body>
<div class="container">
  <h1>🧾 旅游记账本</h1>

  <div class="card">
    <h2>分享给同伴</h2>
    <div class="hint">点「生成分享链接」，再点复制，把链接发到微信。同伴点开就有你的全部数据，接着填。</div>
    <button class="btn-add" onclick="makeLink()">生成分享链接（含数据）</button>
    <div class="share-out" id="shareOut" style="display:none">
      <input type="text" id="shareUrl" readonly onclick="this.select()">
      <button class="btn-copy" onclick="copyShare()">复制链接</button>
      <div class="hint" id="shareNote"></div>
    </div>
    <div class="hint" style="margin-top:12px">收到同伴的链接或口令？粘到下面，点导入。</div>
    <textarea id="importBox" placeholder="粘贴链接或口令"></textarea>
    <button class="btn-copy" style="background:#3182ce" onclick="doImport()">导入数据</button>
    <div class="hint">电脑上也可以用「生成分享网页」下载文件发给别人。</div>
    <button class="btn-ghost" onclick="exportShare()">生成分享网页（下载文件，电脑用）</button>
  </div>

  <div class="card">
    <h2>成员</h2>
    <div class="hint">点头像可从手机相册选真实照片（建议用微信头像）。</div>
    <div id="memberList"></div>
    <button class="btn-member" onclick="addMember()">+ 添加成员</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onPick(this)">

  <div class="card">
    <h2>记一笔</h2>
    <div class="form-row">
      <input type="text" id="desc" placeholder="花了什么（如：早餐）">
    </div>
    <div class="hint">参与人（默认全员，点一下去掉没参加的人）</div>
    <div class="chips" id="partChips"></div>
    <div class="hint">支付人及金额（可多人分摊，合计即本项目总额）</div>
    <div id="payerRows"></div>
    <button class="btn-add" onclick="addRecord()">记上这一笔</button>
  </div>

  <div class="card">
    <h2>结算</h2>
    <div class="summary">
      <div class="item">
        <div class="num" id="total">0.00</div>
        <div class="label">总花费（元）</div>
      </div>
      <div class="item">
        <div class="num" id="pcount">0</div>
        <div class="label">记账笔数</div>
      </div>
    </div>
    <div class="pbook" id="pbook"></div>
    <div class="settle-box" id="settle">还没记过账，先记一笔吧～</div>
  </div>

  <div class="card">
    <h2>账单明细</h2>
    <div id="records"></div>
    <button class="btn-ghost" onclick="clearAll()">清空所有账目</button>
  </div>
</div>

<script>
var KEY = "trip_ledger_v2";
var COLORS = ["#3182ce","#38a169","#d69e2e","#e53e3e","#805ad5","#319795","#dd6b20","#d53f8c"];
var EMBEDDED = null; /*EMBED_HERE*/ // 分享网页会注入数据
var state = { people: [], items: [], nextId: 1 };
var curPart = {}; // 当前编辑中的参与人选择 {id:true}

function parseHash() {
  var m = (location.hash || "").match(/d=([^&]+)/);
  if (!m) return null;
  try {
    return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
  } catch(e) { return null; }
}
var fromHash = parseHash();
if (fromHash && fromHash.people) {
  state = fromHash;
  save();
  history.replaceState(null, "", location.pathname + location.search);
} else if (typeof EMBEDDED !== "undefined" && EMBEDDED && EMBEDDED.people) {
  state = EMBEDDED;
} else {
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.people) state = s;
  } catch(e) {}
}

if (state.people.length === 0) {
  state.people = [{id:1, name:"成员1"}, {id:2, name:"成员2"}];
  state.nextId = 3;
  save();
}

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

/* 生成带数据的分享网页 */
function exportShare() {
  var html = document.documentElement.outerHTML;
  html = html.replace(/var EMBEDDED = [\s\S]*?;\s*\/\*END_EMBED\*\//, '');
  var block = 'var EMBEDDED = ' + JSON.stringify(state) + ';\n/*END_EMBED*/';
  html = html.replace('/*EMBED_HERE*/', block);
  var blob = new Blob([html], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '旅游记账本(含数据).html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  alert('已生成带数据的网页，发给同伴即可接着填。');
}
function personById(id) { for (var i=0;i<state.people.length;i++) if (state.people[i].id===id) return state.people[i]; return null; }
function colorOf(id) { var idx = state.people.findIndex(function(p){return p.id===id;}); return COLORS[idx % COLORS.length]; }
function shortName(p) { var n = (p.name||"").trim(); return n ? n.slice(0,4) : "?"; }
function avatarHtml(id, cls) {
  var p = personById(id);
  if (p && p.img) {
    return '<span class="avatar '+(cls||"")+'" style="background:'+colorOf(id)+';padding:0;overflow:hidden">'
      + '<img src="'+p.img+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block"></span>';
  }
  return '<span class="avatar '+(cls||"")+'" style="background:'+colorOf(id)+'">'+shortName(p).slice(0,1)+'</span>';
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 成员管理 ---------- */
function renderMembers() {
  var html = "";
  for (var i=0;i<state.people.length;i++) {
    var p = state.people[i];
    html += '<div class="member">'
      + '<span onclick="pickImg('+p.id+')" title="点头像上传照片" style="cursor:pointer">'+avatarHtml(p.id)+'</span>'
      + '<input type="text" value="'+esc(p.name)+'" oninput="rename('+p.id+',this.value)" placeholder="姓名/微信名">'
      + (state.people.length>2 ? '<button class="x" onclick="delMember('+p.id+')">×</button>' : '')
      + '</div>';
  }
  document.getElementById("memberList").innerHTML = html;
}
function rename(id, v) { var p = personById(id); if (p){ p.name=v; save(); renderForm(); renderSettle(); renderRecords(); } }
function addMember() {
  if (state.people.length >= 12) { alert("最多 12 人"); return; }
  state.people.push({id: state.nextId++, name:"成员"+(state.people.length+1)});
  save(); renderAll();
}

/* 头像上传 */
var pickTarget = null;
function pickImg(id) { pickTarget = id; document.getElementById("fileInput").click(); }
function onPick(el) {
  var id = pickTarget; pickTarget = null;
  var f = el.files[0]; el.value = "";
  if (!f || !id) return;
  var r = new FileReader();
  r.onload = function() {
    var p = personById(id);
    if (p) { p.img = r.result; save(); renderAll(); }
  };
  r.readAsDataURL(f);
}
function delMember(id) {
  if (state.people.length <= 2) return;
  if (!confirm("删除该成员会同时把他从所有账目里移除，确定吗？")) return;
  state.people = state.people.filter(function(p){return p.id!==id;});
  for (var i=0;i<state.items.length;i++) {
    var it = state.items[i];
    it.participants = it.participants.filter(function(x){return x!==id;});
    if (it.payers[id] !== undefined) delete it.payers[id];
  }
  save(); renderAll();
}

/* ---------- 记一笔表单 ---------- */
function renderForm() {
  // 参与人 chips（默认全选）
  if (Object.keys(curPart).length === 0) {
    for (var i=0;i<state.people.length;i++) curPart[state.people[i].id] = true;
  } else {
    // 清理已删除的人
    var ids = {};
    state.people.forEach(function(p){ids[p.id]=true;});
    Object.keys(curPart).forEach(function(k){ if(!ids[k]) delete curPart[k]; });
  }
  var chips = "";
  for (var j=0;j<state.people.length;j++) {
    var p = state.people[j];
    var on = curPart[p.id] ? "on" : "";
    chips += '<div class="chip '+on+'" onclick="togglePart('+p.id+')">'+avatarHtml(p.id)+shortName(p)+'</div>';
  }
  document.getElementById("partChips").innerHTML = chips;

  // 支付人
  var rows = "";
  for (var k=0;k<state.people.length;k++) {
    var pp = state.people[k];
    rows += '<div class="payer-row">'+avatarHtml(pp.id)
      + '<span class="nm">'+esc(shortName(pp))+'</span>'
      + '<input type="number" step="0.01" inputmode="decimal" id="pay-'+pp.id+'" placeholder="0">'
      + '</div>';
  }
  document.getElementById("payerRows").innerHTML = rows;
}
function togglePart(id) { curPart[id] = !curPart[id]; renderForm(); }

function addRecord() {
  var desc = document.getElementById("desc").value.trim();
  if (!desc) { alert("先写一下花了什么"); return; }
  var participants = state.people.filter(function(p){return curPart[p.id];}).map(function(p){return p.id;});
  if (participants.length === 0) { alert("至少选一个参与人"); return; }
  var payers = {};
  var total = 0;
  for (var i=0;i<state.people.length;i++) {
    var pid = state.people[i].id;
    var inp = document.getElementById("pay-"+pid);
    var v = parseFloat(inp.value);
    if (v && v > 0) { payers[pid] = Math.round(v*100)/100; total += payers[pid]; }
  }
  if (total <= 0) { alert("至少填一个支付金额（大于0）"); return; }
  state.items.push({ id: state.nextId++, desc: desc, participants: participants, payers: payers });
  save();
  document.getElementById("desc").value = "";
  // 重置支付输入
  state.people.forEach(function(p){ var el=document.getElementById("pay-"+p.id); if(el) el.value=""; });
  renderSettle(); renderRecords();
}

function delRecord(id) {
  state.items = state.items.filter(function(it){return it.id!==id;});
  save(); renderSettle(); renderRecords();
}
function clearAll() {
  if (state.items.length === 0) return;
  if (confirm("确定清空所有账目吗？清了找不回来。")) {
    state.items = []; save(); renderSettle(); renderRecords();
  }
}

/* ---------- 结算 ---------- */
function renderSettle() {
  var total = 0;
  var paid = {}, share = {};
  state.people.forEach(function(p){ paid[p.id]=0; share[p.id]=0; });
  for (var i=0;i<state.items.length;i++) {
    var it = state.items[i];
    var sum = 0;
    for (var k in it.payers) sum += it.payers[k];
    total += sum;
    for (var k2 in it.payers) paid[k2] += it.payers[k2];
    var n = it.participants.length;
    if (n > 0) {
      var per = sum / n;
      for (var m=0;m<it.participants.length;m++) share[it.participants[m]] += per;
    }
  }
  // 个人汇总
  var pbook = "";
  state.people.forEach(function(p){
    var net = (paid[p.id]||0) - (share[p.id]||0);
    var sign = net >= 0 ? "+" : "-";
    pbook += '<div class="pr">'+avatarHtml(p.id)
      + '<span class="nm">'+esc(shortName(p))+'</span>'
      + '<span class="val" style="color:'+(net>=0?"#38a169":"#e53e3e")+'">'+sign+"¥"+Math.abs(net).toFixed(2)+'</span>'
      + '</div>';
  });
  document.getElementById("pbook").innerHTML = pbook;
  document.getElementById("total").textContent = total.toFixed(2);
  document.getElementById("pcount").textContent = state.items.length;

  // 转账建议（贪心）
  var creditors = [], debtors = [];
  state.people.forEach(function(p){
    var net = (paid[p.id]||0) - (share[p.id]||0);
    if (net > 0.005) creditors.push({id:p.id, amt:net});
    else if (net < -0.005) debtors.push({id:p.id, amt:-net});
  });
  creditors.sort(function(a,b){return b.amt-a.amt;});
  debtors.sort(function(a,b){return b.amt-a.amt;});
  var lines = [];
  var ci=0, di=0;
  while (ci<creditors.length && di<debtors.length) {
    var c = creditors[ci], d = debtors[di];
    var t = Math.min(c.amt, d.amt);
    t = Math.round(t*100)/100;
    lines.push('<div class="line">'+esc(shortName(personById(d.id)))+' 转给 '+esc(shortName(personById(c.id)))
      + ' <span class="amt">¥'+t.toFixed(2)+'</span></div>');
    c.amt -= t; d.amt -= t;
    if (c.amt <= 0.005) ci++;
    if (d.amt <= 0.005) di++;
  }
  var box = document.getElementById("settle");
  if (state.items.length === 0) box.innerHTML = "还没记过账，先记一笔吧～";
  else if (lines.length === 0) box.innerHTML = '<span class="even">全部打平，不用转钱 👍</span>';
  else box.innerHTML = lines.join("");
}

/* ---------- 明细 ---------- */
function renderRecords() {
  var html = "";
  for (var i=state.items.length-1;i>=0;i--) {
    var it = state.items[i];
    var sum = 0; for (var k in it.payers) sum += it.payers[k];
    var partTags = it.participants.map(function(pid){
      return '<span class="tag">'+avatarHtml(pid)+esc(shortName(personById(pid)))+'</span>';
    }).join("");
    var payTags = [];
    for (var pk in it.payers) payTags.push('<span class="tag">'+avatarHtml(parseInt(pk))+esc(shortName(personById(parseInt(pk))))+' ¥'+it.payers[pk].toFixed(2)+'</span>');
    html += '<div class="record">'
      + '<div class="top"><span class="desc">'+esc(it.desc)+'</span>'
      + '<span><span class="total">¥'+sum.toFixed(2)+'</span>'
      + '<button class="btn-small del" onclick="delRecord('+it.id+')">删</button></span></div>'
      + '<div class="meta">'+it.participants.length+' 人参与 · 每人约 ¥'+(sum/it.participants.length).toFixed(2)+'</div>'
      + '<div class="people">'+partTags+'</div>'
      + '<div class="people">'+payTags.join("")+'</div>'
      + '</div>';
  }
  document.getElementById("records").innerHTML = html || '<div class="empty">还没有记账</div>';
}

function renderAll() { renderMembers(); renderForm(); renderSettle(); renderRecords(); }
renderAll();
</script>
</body>
</html>
